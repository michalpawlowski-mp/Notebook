<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notatnik</title>
    <link rel="shortcut icon" href="ico.svg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Notatnik</h1>
      <div>
        <button type="button" class="add-note-btn" id="addNoteBtn">
          + Dodaj notatkę
        </button>
        <button
          type="button"
          id="themeToggleBtn"
          class="theme-toggle-btn"
          aria-label="Zmień motyw strony"
        >
          🌙
        </button>
      </div>
    </header>

    <main id="notesContainer" class="notes-grid"></main>

    <dialog id="noteDialog" aria-labelledby="dialogTitle">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2 class="dialog-title" id="dialogTitle">Dodaj nową notatkę</h2>
          <button
            type="button"
            class="close-btn"
            id="closeDialogBtn"
            aria-label="Zamknij dialog"
          >
            ❌
          </button>
        </div>

        <form id="noteForm">
          <div class="form-group">
            <label for="noteTitle" class="form-label">Tytuł</label>
            <input
              type="text"
              id="noteTitle"
              class="form-input"
              required
              placeholder="Wprowadź tytuł notatki..."
            />
          </div>

          <div class="form-group">
            <label for="noteContent" class="form-label">Treść</label>
            <textarea
              id="noteContent"
              class="form-textarea"
              required
              placeholder="Napisz swoją notatkę tutaj..."
            ></textarea>
          </div>

          <div class="dialog-actions">
            <button type="button" class="cancel-btn" id="cancelDialogBtn">Anuluj</button>
            <button type="submit" class="save-btn">Zapisz notatkę</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
